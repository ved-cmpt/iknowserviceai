# Overrides for the browser E2E suite. Run it with: npm --prefix e2e run e2e
# Default limits stay in compose.yaml and .env. The suite signs in far more often than a person
# does, so it needs higher limits (ADR-030), and it must never reach a live provider.
services:
  backend:
    environment:
      AI_MODE: mock
      GEMINI_API_KEY: ""
      RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
      RATE_LIMIT_ANALYZE_PER_HOUR: "1000"

  e2e:
    profiles: [e2e]
    build: ./e2e
    environment:
      CI: "1"
      API_URL: http://backend:8000/api/v1
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set in .env}
      SCREENSHOT_DIR: /screenshots
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
      - ./assets/screenshots:/screenshots
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
