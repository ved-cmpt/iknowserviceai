[project]
name = "iknowserviceai-backend"
version = "0.1.0"
description = "FastAPI backend for IknowServiceAI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S"]
ignore = [
    "B008", # FastAPI's Depends() in argument defaults is the framework idiom
]

[tool.ruff.lint.isort]
# The local alembic/ migration folder otherwise makes the library look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/scripts/**" = ["S105"]
"app/scripts/seed_data.py" = ["E501"] # Article text
"alembic/versions/**" = ["E501"]
