# Overrides for running the browser suite against the production image: npm --prefix e2e run e2e:prod
services:
  app:
    environment:
      AI_MODE: mock
      GEMINI_API_KEY: ""
      DEMO_MODE: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
      RATE_LIMIT_ANALYZE_PER_HOUR: "1000"
      RATE_LIMIT_REFRESH_PER_MINUTE: "1000"
      DEMO_MAX_REQUESTS_PER_ACCOUNT_PER_DAY: "10000"
      DEMO_MAX_REQUESTS_TOTAL: "10000"
      DEMO_MAX_ARTICLES: "10000"

  tools:
    environment:
      AI_MODE: mock
      GEMINI_API_KEY: ""
      ALLOW_DEMO_RESET: "true"

  e2e:
    profiles: [e2e]
    build: ./e2e
    environment:
      CI: "1"
      BASE_URL: http://localhost:8080
      HOST_RULES: MAP localhost:8080 app:8000
      API_URL: http://app:8000/api/v1
      PRODUCTION: "1"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set in the env file}
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
    depends_on:
      app:
        condition: service_healthy
