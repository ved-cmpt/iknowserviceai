version: 2

# Quiet on purpose: one grouped pull request per ecosystem, once a month, and at most two open at a
# time. Major upgrades are chosen by hand, so they are ignored here. Version jumps of base images
# count as minor to semver, so those are held by version range as well.
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The Playwright image in e2e/Dockerfile must be upgraded together with @playwright/test (ADR-037),
  # so that pair is left out here and upgraded by hand.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      e2e:
        patterns: ["*"]
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base images stay on Python 3.12, Node 24 and PostgreSQL 17.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        versions: [">=3.13"]
      - dependency-name: node
        versions: [">=25"]
      - dependency-name: postgres
        versions: [">=18"]
