version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

  # The Playwright image in e2e/Dockerfile must be upgraded together with @playwright/test (ADR-037),
  # so that pair is left out here and upgraded by hand.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /deploy
    schedule:
      interval: weekly
